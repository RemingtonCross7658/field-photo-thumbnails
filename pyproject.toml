[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "field-photo-thumbnails"
version = "0.1.0"
description = "Responsive work-order photo thumbnails with dispatch follow-up decisions"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/field_photo_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

